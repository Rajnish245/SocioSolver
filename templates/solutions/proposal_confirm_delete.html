{% extends 'base.html' %}

{% block title %}Delete Proposal — SocioSolve{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 text-center">
          <div class="rounded-circle bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-trash fs-2"></i>
          </div>
          <h4 class="fw-bold mb-2">Delete Solution Proposal?</h4>
          <p class="text-muted mb-4">
            Are you sure you want to delete proposal <strong>"{{ proposal.title }}"</strong>?
          </p>
          <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
              <a href="{% url 'solutions:proposal_detail' pk=proposal.pk %}" class="btn btn-light px-4">Cancel</a>
              <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete Proposal</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
